name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        working-directory: backend
        run: uv sync --frozen --default-index https://pypi.org/simple

      - name: 代码检查
        working-directory: backend
        run: uv run ruff check .

      - name: 格式检查
        working-directory: backend
        run: uv run ruff format --check .

      - name: 类型检查
        working-directory: backend
        run: uv run mypy app cli

      - name: 模块边界检查
        working-directory: backend
        run: uv run lint-imports

      - name: 单元与集成测试
        working-directory: backend
        run: uv run pytest -m "not docker and not agent" -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 扫描密钥
        run: python3 scripts/check_secrets.py
