name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # 数据库约束（合法组合、认定结果唯一）只有连上真的 PostgreSQL 才测得到。
    # 没有这个 service，带 db 标记的测试会被跳过，CI 就变成"绿灯但什么都没验"。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bench
          POSTGRES_USER: bench
          POSTGRES_PASSWORD: bench
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bench -d bench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      BENCH_DATABASE_URL: postgresql+psycopg://bench:bench@localhost:5433/bench

    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        working-directory: backend
        run: uv sync --frozen --default-index https://pypi.org/simple

      - name: 代码检查
        working-directory: backend
        run: uv run ruff check . ../scripts ../docs

      - name: 格式检查
        working-directory: backend
        run: uv run ruff format --check . ../scripts ../docs

      - name: 类型检查
        working-directory: backend
        run: uv run mypy app cli

      - name: 模块边界检查
        working-directory: backend
        run: uv run lint-imports

      - name: 迁移与模型是否一致
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base

      - name: 单元与集成测试
        working-directory: backend
        run: uv run pytest -m "not docker and not agent" -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: eslint
        working-directory: frontend
        run: npm run lint

      - name: 类型检查
        working-directory: frontend
        run: npm run typecheck

      - name: 生产构建
        working-directory: frontend
        run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 扫描密钥
        run: python3 scripts/check_secrets.py
