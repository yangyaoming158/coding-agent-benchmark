# Alembic 配置。
#
# 这里**故意不写** sqlalchemy.url：连接串里有密码，写进版本控制不合适。
# 实际的连接串由 alembic/env.py 从环境变量 BENCH_DATABASE_URL 读取。

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# 迁移文件名形如 0001_initial_schema.py，按序号排序一目了然
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
# 自动生成的迁移也要过一遍 ruff，否则 CI 的格式检查会挂
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
