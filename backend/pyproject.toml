[project]
name = "coding-agent-benchmark"
version = "0.1.0"
description = "AI Coding Agent 评测基准平台（SWE-Bench 式）"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "docker>=7.1",
    "structlog>=24.4",
    "httpx>=0.28",
    "typer>=0.15",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "import-linter>=2.1",
    "pre-commit>=4.0",
    "types-docker",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "cli"]

# ── 代码检查 ──
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # 中文标点会被误报为"易混淆字符"，本项目要求中文注释
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# 迁移是 Alembic 自动生成的：CHECK 约束里那条合法组合表达式有 3000 多字符，
# 拆行只会让它更难读，而且下次重新生成又会变回去
"alembic/versions/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"

# ── 类型检查 ──
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["^alembic/versions/"]

[[tool.mypy.overrides]]
module = ["docker.*"]
ignore_missing_imports = true

# ── 测试 ──
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "db: 需要一个跑着的 PostgreSQL（./scripts/dev_db.sh up），连不上就跳过",
    "docker: 需要可用的 Docker daemon，每日夜间跑",
    "agent: 会消耗真实大模型额度，手动触发",
    "slow: 单条耗时超过 10 秒",
]

# ── 模块边界（§14.2 的依赖方向，违反即 CI 失败）──
[tool.importlinter]
root_packages = ["app"]

[[tool.importlinter.contracts]]
name = "分层依赖：上层可依赖下层，下层不可反向依赖"
type = "layers"
layers = [
    "app.api",
    "app.evaluation | app.benchmark | app.report",
    "app.runner | app.sandbox | app.judge | app.attribution",
    "app.storage",
    "app.infrastructure",
    "app.domain",
]

[[tool.importlinter.contracts]]
name = "domain 不依赖任何其他模块"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "app.api", "app.evaluation", "app.benchmark", "app.report",
    "app.runner", "app.sandbox", "app.judge", "app.attribution",
    "app.storage", "app.infrastructure", "app.worker",
]

[[tool.importlinter.contracts]]
name = "sandbox 不依赖 runner（是 runner 用 sandbox，不能反过来）"
type = "forbidden"
source_modules = ["app.sandbox"]
forbidden_modules = ["app.runner"]

[[tool.importlinter.contracts]]
name = "judge 不依赖 runner 与 attribution（判定必须独立于谁产生的补丁）"
type = "forbidden"
source_modules = ["app.judge"]
forbidden_modules = ["app.runner", "app.attribution"]

# ── 包索引：用国内镜像，避免走 VPN 拉 PyPI 超时（见风险 R18）──
[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
